services:
  legadohub:
    build:
      context: .
      args:
        APP_UID: "${LEGADOHUB_APP_UID:-1000}"
        APP_GID: "${LEGADOHUB_APP_GID:-1000}"
    container_name: legadohub
    restart: unless-stopped
    init: true
    ports:
      - "${LEGADOHUB_BIND_ADDRESS:-127.0.0.1}:${LEGADOHUB_PORT:-8765}:8765"
      - "${LEGADOHUB_ADMIN_BIND_ADDRESS:-0.0.0.0}:${LEGADOHUB_ADMIN_PORT:-8766}:8766"
    environment:
      LEGADOHUB_BROWSER_PROVIDER: chromium
      LEGADOHUB_BROWSER_ENABLED: "1"
      LEGADOHUB_BROWSER_DISABLE_SANDBOX: "0"
      LEGADOHUB_BROWSER_PROFILE_ROOT: /app/backend/data/browser_profiles
      LEGADOHUB_PUBLIC_MODE: "${LEGADOHUB_PUBLIC_MODE:-0}"
      LEGADOHUB_PUBLIC_BASE_URL: "${LEGADOHUB_PUBLIC_BASE_URL:-http://127.0.0.1:8765}"
      LEGADOHUB_ALLOWED_HOSTS: "${LEGADOHUB_ALLOWED_HOSTS:-127.0.0.1,localhost}"
      LEGADOHUB_ALLOWED_ORIGINS: "${LEGADOHUB_ALLOWED_ORIGINS:-http://127.0.0.1:8765}"
      LEGADOHUB_TRUSTED_PROXIES: "${LEGADOHUB_TRUSTED_PROXIES:-127.0.0.1/32}"
      LEGADOHUB_ADMIN_BASE_URL: "${LEGADOHUB_ADMIN_BASE_URL:-http://127.0.0.1:8766}"
      LEGADOHUB_ADMIN_ALLOWED_HOSTS: "${LEGADOHUB_ADMIN_ALLOWED_HOSTS:-127.0.0.1,localhost}"
      LEGADOHUB_ADMIN_ALLOWED_ORIGINS: "${LEGADOHUB_ADMIN_ALLOWED_ORIGINS:-http://127.0.0.1:8766}"
      LEGADOHUB_ADMIN_TRUSTED_PROXIES: "${LEGADOHUB_ADMIN_TRUSTED_PROXIES:-127.0.0.1/32}"
      LEGADOHUB_ADMIN_PASSWORD_FILE: "${LEGADOHUB_ADMIN_PASSWORD_FILE:-}"
    volumes:
      - "${LEGADOHUB_OFFICIAL_PLUGINS_DIR:-./plugins/sources/official}:/app/plugins/sources/official:ro"
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /home/legadohub/.cache:size=256m,mode=700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request as u; assert json.load(u.urlopen('http://127.0.0.1:8765/api/auth/entrypoint', timeout=3))['entrypoint'] == 'public'; assert json.load(u.urlopen('http://127.0.0.1:8766/api/auth/entrypoint', timeout=3))['entrypoint'] == 'admin'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      legadohub_internal:
        ipv4_address: 172.31.250.20

networks:
  legadohub_internal:
    ipam:
      config:
        - subnet: 172.31.250.0/24
