services:
  legadohub-init:
    image: xzixmn/legado-hub:latest
    user: "0:0"
    command: ["--initialize-runtime", "/app/plugins/sources/thirdparty"]
    volumes:
      - "./data:/app/backend/data"
      - "./config:/app/backend/config"
      - "./generated:/app/backend/generated"
      - "./runtime:/app/backend/runtime"
      - "./plugins/sources/thirdparty:/app/plugins/sources/thirdparty"
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE

  legadohub:
    image: xzixmn/legado-hub:latest
    restart: unless-stopped
    init: true
    depends_on:
      legadohub-init:
        condition: service_completed_successfully
    ports:
      - "8765:8765"
      - "8766:8766"
    environment:
      LEGADOHUB_EXTERNAL_HOST: "${LEGADOHUB_EXTERNAL_HOST:-}"
    volumes:
      - "./data:/app/backend/data"
      - "./config:/app/backend/config"
      - "./generated:/app/backend/generated"
      - "./runtime:/app/backend/runtime"
      - "./plugins/sources/thirdparty:/app/plugins/sources/thirdparty"
      - "./plugins/sources/official:/app/plugins/sources/official:ro"
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /home/legadohub/.cache:size=256m,mode=700,uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request as u; assert json.load(u.urlopen('http://127.0.0.1:8765/api/auth/entrypoint', timeout=3))['entrypoint'] == 'public'; assert json.load(u.urlopen('http://127.0.0.1:8766/api/auth/entrypoint', timeout=3))['entrypoint'] == 'admin'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
