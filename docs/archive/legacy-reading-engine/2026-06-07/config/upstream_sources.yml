sources:
  - id: xiu2_yuedu
    name: XIU2 精品书源
    type: direct_book_source
    homepage: https://github.com/XIU2/Yuedu
    fetch:
      kind: raw_file
      url: https://raw.githubusercontent.com/XIU2/Yuedu/master/shuyuan
    priority: 10
    enabled: true
    notes: 第一阶段优先接入的小规模精品书源。

  - id: aoaostar_legado_release
    name: AOAOSTAR 阅读源发布分支
    type: aggregate_release
    homepage: https://github.com/aoaostar/legado
    fetch:
      kind: git_branch
      repo: https://github.com/aoaostar/legado.git
      branch: release
      include:
        - sources/*.json
        - sources/*.zip
    priority: 20
    enabled: true
    notes: 聚合后的发布产物，可用于批量导入和去重验证。

  - id: aoaostar_legado_main
    name: AOAOSTAR 阅读源同步器
    type: sync_reference
    homepage: https://github.com/aoaostar/legado
    fetch:
      kind: git_branch
      repo: https://github.com/aoaostar/legado.git
      branch: main
      include:
        - conf/*.yml
        - src/**/*.py
    priority: 30
    enabled: false
    notes: 作为同步器和来源配置参考，不直接暴露为书源。

  - id: luoyacheng_legado
    name: 阅读 APP 原生解析引擎
    type: native_legado_engine_reference
    homepage: https://github.com/Luoyacheng/legado
    fetch:
      kind: git_branch
      repo: https://github.com/Luoyacheng/legado.git
      branch: main
      include:
        - app/src/main/java/io/legado/app/model/analyzeRule/*.kt
        - app/src/main/java/io/legado/app/model/analyzeRule/*.java
        - app/src/main/java/io/legado/app/model/webBook/*.kt
        - app/src/main/java/io/legado/app/data/entities/BookSource.kt
        - app/src/main/java/io/legado/app/data/entities/rule/*.kt
        - app/src/main/java/io/legado/app/help/JsExtensions.kt
        - app/src/main/java/io/legado/app/help/http/*.kt
        - app/src/main/java/io/legado/app/help/source/*.kt
        - modules/rhino/src/main/java/com/script/**/*.kt
        - modules/rhino/src/main/java/com/script/**/*.java
    priority: 35
    enabled: true
    notes: 阅读原生规则解析链路来源，优先评估 JVM 抽取或独立解析服务桥接。

  - id: yiove_shuyuan
    name: Yiove 综合书源库
    type: discovery_index
    homepage: https://shuyuan.yiove.com/
    fetch:
      kind: website_api
      frontend_url: https://shuyuan.yiove.com/book-source-collections
      api_base_url: https://shuyuan-api.yiove.com
      collections_url: https://shuyuan-api.yiove.com/shuyuan/book-source-collections?page=1&page_size=100
      import_url_template: https://shuyuan-api.yiove.com/import/book-source-collection/{collection_id}
      include_year: 2026
    priority: 40
    enabled: true
    notes: 页面路由返回 SPA HTML；真实 API 已确认。当前采集 2026 年更新的书源合集并按站点归档。

  - id: freeok_so_novel
    name: So Novel 规则与聚合搜索参考
    type: rule_engine_reference
    homepage: https://github.com/freeok/so-novel
    fetch:
      kind: git_branch
      repo: https://github.com/freeok/so-novel.git
      branch: main
      include:
        - BOOK_SOURCES.md
        - bundle/rules/*.json
        - bundle/rules/*.json5
        - src/main/java/com/pcdd/sonovel/model/Rule.java
        - src/main/java/com/pcdd/sonovel/action/AggregatedSearchAction.java
        - src/main/java/com/pcdd/sonovel/parse/*.java
        - src/main/java/com/pcdd/sonovel/core/Crawler.java
    priority: 45
    enabled: true
    notes: 不是阅读书源格式，需要做规则转换或单独实现 So Novel 规则适配层。

  - id: sjshb57_legado_57
    name: legado-57 规则来源
    type: rule_candidate
    homepage: https://github.com/sjshb57/legado-57
    fetch:
      kind: git_branch
      repo: https://github.com/sjshb57/legado-57.git
      branch: main
    priority: 50
    enabled: false
    notes: 接入前需要扫描目录结构并分类规则类型。
