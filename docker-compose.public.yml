services:
  legadohub:
    environment:
      LEGADOHUB_PUBLIC_MODE: "1"
      LEGADOHUB_PUBLIC_BASE_URL: "https://${LEGADOHUB_PUBLIC_HOST:?set LEGADOHUB_PUBLIC_HOST}"
      LEGADOHUB_BROWSER_PUBLIC_BASE_URL: "https://${LEGADOHUB_PUBLIC_HOST:?set LEGADOHUB_PUBLIC_HOST}"
      LEGADOHUB_ALLOWED_HOSTS: "${LEGADOHUB_PUBLIC_HOST:?set LEGADOHUB_PUBLIC_HOST}"
      LEGADOHUB_ALLOWED_ORIGINS: "https://${LEGADOHUB_PUBLIC_HOST:?set LEGADOHUB_PUBLIC_HOST}"
      LEGADOHUB_TRUSTED_PROXIES: "172.31.250.10/32"
      LEGADOHUB_ADMIN_PASSWORD_FILE: /run/secrets/legadohub_admin_password
    secrets:
      - legadohub_admin_password
    networks:
      legadohub_internal:
        ipv4_address: 172.31.250.20

  caddy:
    image: caddy:2.10-alpine
    container_name: legadohub-caddy
    restart: unless-stopped
    init: true
    depends_on:
      legadohub:
        condition: service_healthy
    environment:
      LEGADOHUB_PUBLIC_HOST: "${LEGADOHUB_PUBLIC_HOST:?set LEGADOHUB_PUBLIC_HOST}"
      LEGADOHUB_EDGE_TRUSTED_PROXIES: "${LEGADOHUB_EDGE_TRUSTED_PROXIES:-127.0.0.1/32}"
      LEGADOHUB_EDGE_RATE_LIMIT_VERIFIED: "${LEGADOHUB_EDGE_RATE_LIMIT_VERIFIED:?configure and verify an upstream edge rate limiter before public deployment}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      legadohub_internal:
        ipv4_address: 172.31.250.10

secrets:
  legadohub_admin_password:
    file: "${LEGADOHUB_ADMIN_PASSWORD_SECRET_FILE:?set LEGADOHUB_ADMIN_PASSWORD_SECRET_FILE}"

volumes:
  caddy_data:
  caddy_config:
