<script>
(function() {
    var noticeKey = 'gonggao_shown';
    var expireTime = 60 * 60 * 1000;
    function shouldShowNotice() {
        var stored = localStorage.getItem(noticeKey);
        if (!stored) return true;
        try {
            var data = JSON.parse(stored);
            var now = new Date().getTime();
            return (now - data.timestamp) > expireTime;
        } catch(e) { return true; }
    }
    function markNoticeShown() {
        localStorage.setItem(noticeKey, JSON.stringify({timestamp: new Date().getTime()}));
    }
    function showNotice(message) {
        var noticeDiv = document.createElement('div');
        noticeDiv.className = 'local-notice';
        noticeDiv.textContent = message;
        document.body.appendChild(noticeDiv);
        setTimeout(function() { noticeDiv.classList.add('show'); }, 10);
        setTimeout(function() {
            noticeDiv.classList.remove('show');
            setTimeout(function() { if(noticeDiv.parentNode) noticeDiv.parentNode.removeChild(noticeDiv); }, 300);
        }, 10000);
    }
    if (shouldShowNotice()) {
        var msg = "提醒，请勿上传不良小说，分享让你我快乐！";
        if (msg) { showNotice(msg); markNoticeShown(); }
    }
})();
</script>
