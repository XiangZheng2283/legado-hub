contractVersion: "1.0"
id: xhytd_com
name: 黄易天地
version: 0.1.0
type: source
domains:
  - xhytd.com
baseUrls:
  - https://www.xhytd.com
capabilities:
  - search
  - detail
  - toc
  - chapter
enabled: true
proxy:
  mode: auto
  required: false
browser:
  mode: none
  reason: ""
auth:
  mode: none
  cookieDomains: []
content:
  access: free
tags:
  - html
  - no-login
  - cloudflare
  - search_provider
accessStrategy:
  search: search_provider
searchProvider:
  providerOrder:
    - bing_html
    - google_html
  targetDomain: www.xhytd.com
  querySitePath: /book
  urlPatterns:
    - /book/\d+/
