contractVersion: "1.0"
id: 96dushu_com
name: 96读书
author: Yunwei
version: 0.1.2
type: source
domains:
  - 96dushu.com
baseUrls:
  - https://www.96dushu.com
capabilities:
  - search
  - detail
  - toc
  - chapter
enabled: true
rateLimit:
  perHostConcurrency: 1
  minIntervalMs: 900
proxy:
  mode: auto
  required: false
browser:
  mode: none
  reason: ""
auth:
  mode: none
  cookieDomains: []
content:
  access: free
tags:
  - html
  - no-login
  - cloudflare
  - js_encrypted
  - search_provider
accessStrategy:
  search: search_provider
searchProvider:
  providerOrder:
    - bing_html
    - google_html
  targetDomain: www.96dushu.com
  querySitePath: /book
  urlPatterns:
    - /book/\d+/
