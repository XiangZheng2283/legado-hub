contractVersion: "1.0"
id: twkan_com
name: 台灣小說網
author: Yunwei
version: 0.1.8
type: source
domains:
  - twkan.com
baseUrls:
  - https://twkan.com
capabilities:
  - search
  - detail
  - toc
  - chapter
auth:
  mode: none
  cookieDomains:
    - twkan.com
content:
  access: free
proxy:
  mode: auto
  required: false
browser:
  mode: optional
  reason: cloudflare_challenge
accessStrategy:
  search: stealth_http
  detail: stealth_http
  toc: stealth_http
  chapter: stealth_http
rateLimit:
  perHostConcurrency: 3
  minIntervalMs: 1000
tags:
  - html
  - ajax-api
  - no-login
  - proxy
  - impersonate
  - browser-fallback
domainProfiles:
  - id: primary
    baseUrl: https://twkan.com
    domains:
      - twkan.com
    role: desktop
    fallback: true
searchProvider:
  providerOrder:
    - duckduckgo_ddgs
    - bing_html
    - google_html
  targetDomain: twkan.com
  querySitePath: /book
  urlPatterns:
    - /book/\d+\.html
    - /book/\d+
    - /txt/\d+/\d+
adPatterns:
  - 'GOOGLE搜索TWKAN'
  - '台湾小说网→'
