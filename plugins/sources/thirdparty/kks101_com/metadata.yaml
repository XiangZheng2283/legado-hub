contractVersion: "1.0"
id: kks101_com
name: 101看书网
author: Yunwei
version: 0.1.2
type: source
domains:
  - 101kks.com
baseUrls:
  - https://101kks.com
capabilities:
  - search
  - detail
  - toc
  - chapter
auth:
  mode: none
  cookieDomains:
    - 101kks.com
content:
  access: free
proxy:
  mode: auto
  required: false
browser:
  mode: optional
  reason: cloudflare_challenge
accessBridge:
  search:
    providers:
      - duckduckgo_ddgs
      - bing_html
      - google_html
searchProvider:
  providerOrder:
    - duckduckgo_ddgs
    - bing_html
    - google_html
  targetDomain: 101kks.com
  querySitePath: /book
  urlPatterns:
    - /book/\d+\.html
    - /book/\d+
tags:
  - html
  - ajax-api
  - no-login
  - cloudflare
  - browser-bypass
  - search-provider
enabled: true
rateLimit:
  perHostConcurrency: 3
  minIntervalMs: 1200
sourceSeed:
  type: manual
  upstreamId: 101kks.com
  upstreamFile: ""
  upstreamCommit: ""
