contractVersion: "1.0"
id: xiaoshuohu_com
name: 小说虎
version: 0.1.0
type: source
domains:
  - xiaoshuohu.com
baseUrls:
  - https://www.xiaoshuohu.com
capabilities:
  - search
  - detail
  - toc
  - chapter
enabled: true
proxy:
  mode: auto
  required: false
browser:
  mode: none
  reason: ""
auth:
  mode: none
  cookieDomains: []
content:
  access: free
tags:
  - html
  - no-login
  - ads
  - search_provider
accessStrategy:
  search: search_provider
searchProvider:
  providerOrder:
    - bing_html
    - google_html
  targetDomain: www.xiaoshuohu.com
  querySitePath: /book
  urlPatterns:
    - /book/\d+/
